<!-- wndx2.github.io -->

<html>
	<head>
		<title>¡wndud!</title>
		<link rel="stylesheet" href="style.css" />
		<!-- Move script to end of body for proper DOMContentLoaded timing -->
	</head>
	<body>
		<div class="c-center" style="font-family: wndyd">
			<div class="p-center">
				<h1 style="font-size: 50px">
					<script>
						const today = new Date();
						const day = String(today.getDate()).padStart(2, "0");
						const month = String(today.getMonth() + 1).padStart(2, "0");
						const year = today.getFullYear();
						document.write(`${day}.${month}.${year}`); // returns as html
					</script>
				</h1>
				<p id="live-time"></p>
			</div>
		</div>
		<main>
			<p>Github: wndx2 & sleepywndud</p>
			<p>Discord: wndx2 & sleepywndud</p>
			<p>IG: sleepywndud</p>
		</main>
		<!-- Script moved here for correct DOM loading -->
		<script src="script.js"></script>
		<script>
			// Debug: log errors if script.js fails
			window.addEventListener("error", function (e) {
				console.error("Script error:", e.message, "at", e.filename, "line", e.lineno);
			});
		</script>
	</body>
</html>

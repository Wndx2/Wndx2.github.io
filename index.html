<html>
	<head>
		<title>¡wndud!</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<a
			href="https://www.desmos.com/calculator/k2clisypui"
			target="_blank"
			class="top-right-btn"
			title="Desmos"
		>
			<img src="https://www.desmos.com/apple-touch-icon.png" alt="Desmos Logo" />
		</a>
		<div class="waves-container">
			<svg
				class="waves"
				xmlns="http://www.w3.org/2000/svg"
				xmlns:xlink="http://www.w3.org/1999/xlink"
				viewBox="0 24 150 28"
				preserveAspectRatio="none"
				shape-rendering="auto"
			>
				<defs>
					<path
						id="gentle-wave"
						d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"
					/>
				</defs>
				<g class="parallax">
					<use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.03)" />
					<use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.03)" />
					<use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.03)" />
					<use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(255,255,255,0.03)" />
				</g>
			</svg>
		</div>

		<div class="c-center">
			<div class="p-center">
				<h1 id="date"></h1>
				<p id="live-time"></p>
			</div>
		</div>

		<main>
			<p>Github: wndx2 & sleepywndud</p>
			<p>Discord: wndx2 & sleepywndud</p>
			<p>IG: sleepywndud</p>
		</main>

		<script src="script.js"></script>
	</body>
</html>
